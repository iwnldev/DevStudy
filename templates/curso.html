<h1>{{ curso.titulo }}</h1>
<p>{{ curso.descricao or 'Sem descrição.' }}</p>

<h2>Adicionar módulo</h2>
<form action="{{ url_for('novo_modulo', curso_id=curso.id) }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="titulo">Título</label>
    <input id="titulo" name="titulo" maxlength="120" required>

    <label for="descricao">Descrição</label>
    <textarea id="descricao" name="descricao" maxlength="1000"></textarea>

    <label for="ordem">Ordem</label>
    <input id="ordem" name="ordem" type="number" min="1" max="10000" value="1" required>

    <button type="submit">Adicionar módulo</button>
</form>

<h2>Módulos do curso</h2>
{% for modulo in modulos %}
    <section>
        <h3>{{ modulo.titulo }}</h3>
        <p>{{ modulo.descricao or 'Sem descrição.' }}</p>
        <p>Ordem: {{ modulo.ordem }}</p>
        <form action="{{ url_for('excluir_modulo', modulo_id=modulo.id) }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit">Excluir módulo</button>
        </form>
    </section>
{% else %}
    <p>Este curso ainda não tem módulos.</p>
{% endfor %}
