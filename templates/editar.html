
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar anotação | DevStudy</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <header>
        <h1>DevStudy</h1>
        <p>Atualize seu conhecimento.</p>
    </header>

    <main>
        <section>
            <h2>Editar anotação</h2>

            {% if erro %}
                <p class="mensagem-erro" role="alert">{{ erro }}</p>
            {% endif %}

            <form method="POST">

                <!-- Token de segurança CSRF -->
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <label for="titulo">Título</label>
                <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    maxlength="100"
                    value="{{ anotacao['titulo'] }}"
                    required
                >

                <label for="categoria">Categoria de estudo</label>
                <select id="categoria" name="categoria" required>
                    {% for categoria in categorias %}
                        <option
                            value="{{ categoria }}"
                            {% if anotacao['categoria'] == categoria %}
                                selected
                            {% endif %}
                        >
                            {{ categoria }}
                        </option>
                    {% endfor %}
                </select>

                <label for="materia">Matéria ou tecnologia</label>
                <input
                    type="text"
                    id="materia"
                    name="materia"
                    maxlength="60"
                    value="{{ anotacao['materia'] }}"
                    list="materias-anotacao"
                    required
                >

                <datalist id="materias-anotacao">
                    {% for assunto in assuntos_disponiveis|unique(attribute='materia') %}
                        <option value="{{ assunto['materia'] }}"></option>
                    {% endfor %}
                </datalist>

                <label for="assunto-edicao">Assunto <span>(opcional)</span></label>
                <select id="assunto-edicao" name="assunto_id">
                    <option value="">Sem assunto específico</option>
                    {% for assunto in assuntos_disponiveis %}
                        <option
                            value="{{ assunto['id'] }}"
                            data-materia="{{ assunto['materia'] }}"
                            {% if anotacao['assunto_id'] == assunto['id'] %}selected{% endif %}
                        >{{ assunto['materia'] }} · {{ assunto['nome'] }}</option>
                    {% endfor %}
                </select>

                <label for="conteudo">Conteúdo</label>
                <textarea
                    id="conteudo"
                    name="conteudo"
                    rows="8"
                    maxlength="10000"
                    required
                >{{ anotacao['conteudo'] }}</textarea>

                <button type="submit">Salvar alterações</button>

                <a href="{{ url_for('inicio') }}">
                    Cancelar e voltar
                </a>
            </form>
        </section>
    </main>

    <footer>
        <p>DevStudy — Aprender, praticar e evoluir.</p>
    </footer>
    <script>
        const materiaNota = document.getElementById("materia");
        const assuntoNota = document.getElementById("assunto-edicao");
        function filtrarAssuntos() {
            const nomeMateria = materiaNota.value.trim().normalize("NFC").toLocaleLowerCase("pt-BR");
            Array.from(assuntoNota.options).forEach((opcao) => {
                if (!opcao.value) return;
                const nomeAssociado = (opcao.dataset.materia || "").trim().normalize("NFC").toLocaleLowerCase("pt-BR");
                const disponivel = nomeMateria !== "" && nomeAssociado === nomeMateria;
                opcao.hidden = !disponivel;
                opcao.disabled = !disponivel;
                if (!disponivel && opcao.selected) assuntoNota.value = "";
            });
        }
        materiaNota.addEventListener("input", filtrarAssuntos);
        filtrarAssuntos();
    </script>
</body>
</html>
